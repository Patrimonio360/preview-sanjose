backend:
  name: github
  repo: Patrimonio360/preview-sanjose
  branch: master
  base_url: https://oauth-sanjose.vercel.app
  auth_endpoint: api/auth

locale: "es"
media_folder: "site/img/uploads"
public_folder: "/preview-sanjose/site/img/uploads"

collections:
  - name: "products"
    label: "Productos"
    files:
      - label: "Productos"
        name: "products"
        file: "site/_data/products.json"
        fields:
          - label: "Productos"
            name: "products"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "number" }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Marca", name: "brand", widget: "string" }
              - { label: "Precio (EUR)", name: "price", widget: "number", value_type: "float" }
              - label: "Categoria"
                name: "category"
                widget: "select"
                options:
                  - { label: "Alimento", value: "alimento" }
                  - { label: "Juguetes", value: "juguetes" }
                  - { label: "Accesorios", value: "accesorios" }
                  - { label: "Higiene", value: "higiene" }
              - { label: "Imagen", name: "image", widget: "image", required: false }
              - { label: "Etiqueta", name: "tag", widget: "string", required: false }
              - { label: "Descripcion", name: "description", widget: "text" }

  - name: "services"
    label: "Servicios"
    files:
      - label: "Servicios"
        name: "services"
        file: "site/_data/services.json"
        fields:
          - label: "Servicios"
            name: "services"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "number" }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Icono (emoji)", name: "icon", widget: "string" }
              - { label: "Imagen", name: "image", widget: "image", required: false }
              - { label: "Descripcion corta", name: "shortDesc", widget: "string" }
              - { label: "Descripcion completa", name: "description", widget: "text" }
              - label: "Caracteristicas"
                name: "features"
                widget: "list"
                field:
                  label: "Caracteristica"
                  name: "feature"
                  widget: "string"

  - name: "plans"
    label: "Suscripciones"
    files:
      - label: "Planes de Salud"
        name: "plans"
        file: "site/_data/plans.json"
        fields:
          - label: "Planes"
            name: "plans"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "number" }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Icono", name: "icon", widget: "string" }
              - { label: "Descripcion", name: "description", widget: "string" }
              - { label: "Precio (EUR/mes)", name: "price", widget: "number", value_type: "float" }
              - { label: "Periodo", name: "period", widget: "string" }
              - { label: "Ahorro", name: "savings", widget: "string", required: false }
              - { label: "Badge", name: "badge", widget: "string", required: false }
              - label: "Caracteristicas"
                name: "features"
                widget: "list"
                field:
                  label: "Caracteristica"
                  name: "feature"
                  widget: "string"

  - name: "settings"
    label: "Ajustes"
    files:
      - label: "Info Clinica"
        name: "clinic-info"
        file: "site/_data/settings.json"
        fields:
          - { label: "Nombre", name: "name", widget: "string" }
          - { label: "Direccion", name: "address", widget: "string" }
          - { label: "Telefono", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Horario", name: "hours", widget: "string" }
          - { label: "CIF/NIF", name: "cif", widget: "string" }
          - { label: "WhatsApp (sin +)", name: "whatsapp", widget: "string" }
          - { label: "Facebook URL", name: "facebook", widget: "string" }
          - { label: "Instagram URL", name: "instagram", widget: "string" }
          - { label: "Anos de experiencia (confianza)", name: "trustYears", widget: "string" }
          - { label: "Familias confianza (confianza)", name: "trustFamilies", widget: "string" }
          - { label: "Laboratorio (confianza)", name: "trustLab", widget: "string" }
          - { label: "Accesible (confianza)", name: "trustAccessible", widget: "string" }

  - name: "chatbot"
    label: "VetBot"
    folder: "site/_data/chatbot"
    create: true
    delete: true
    slug: "{{id}}-{{slug}}"
    summary: "{{keywords}}"
    fields:
      - { label: "ID", name: "id", widget: "number" }
      - { label: "Palabras clave", name: "keywords", widget: "string" }
      - { label: "Respuesta", name: "response", widget: "text" }

  - name: "reviews"
    label: "Testimonios"
    folder: "site/_data/reviews"
    create: true
    delete: true
    slug: "{{id}}-{{slug}}"
    summary: "{{author}} - {{pet}}"
    fields:
      - { label: "ID", name: "id", widget: "number" }
      - { label: "Autor", name: "author", widget: "string" }
      - { label: "Mascota (nombre y tipo)", name: "pet", widget: "string" }
      - { label: "Texto", name: "text", widget: "text" }
      - { label: "Estrellas (1-5)", name: "rating", widget: "number", min: 1, max: 5 }

  - name: "photos"
    label: "Fotos Clinica"
    folder: "site/_data/photos"
    create: true
    delete: true
    slug: "{{id}}-{{slug}}"
    summary: "{{title}} - {{usage}}"
    fields:
      - { label: "ID", name: "id", widget: "number" }
      - { label: "Titulo", name: "title", widget: "string" }
      - { label: "Imagen", name: "image", widget: "image" }
      - label: "Donde se usa"
        name: "usage"
        widget: "select"
        options:
          - { label: "Portada / Hero", value: "hero" }
          - { label: "Inicio (Resto)", value: "home" }
          - { label: "Pagina Nosotros", value: "nosotros" }
          - { label: "Pagina Servicios", value: "servicios" }
          - { label: "Pagina Contacto", value: "contacto" }
          - { label: "Footer / General", value: "general" }
      - { label: "Descripcion", name: "description", widget: "string", required: false }
